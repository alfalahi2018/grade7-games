<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saturday Plans Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#14205a;--panel:#1e2d7d;--paper:#fffdf7;--ink:#14205a;--sun:#ffc93c;--aqua:#27c4b5;--coral:#ff5d73;--ok:#1fb86b;--no:#e5484d;--mute:#b9c3ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1540;--panel:#17236b;--paper:#f3f0e6}}
:root[data-theme="dark"]{--bg:#0d1540;--panel:#17236b;--paper:#f3f0e6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:Nunito,system-ui,"Segoe UI",Arial,sans-serif;font-weight:600;min-height:100vh;
background-image:radial-gradient(circle at 12% 8%,rgba(255,255,255,.18) 0 2px,transparent 3px),radial-gradient(circle at 78% 14%,rgba(255,255,255,.14) 0 2px,transparent 3px),radial-gradient(circle at 40% 4%,rgba(255,255,255,.12) 0 1.5px,transparent 3px);background-size:260px 200px}
h1,h2,h3,.brand{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800;margin:0}
#app{max-width:900px;margin:0 auto;padding:12px 14px 30px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.brand{font-size:1.25rem;color:var(--sun)}
.hud{display:flex;gap:8px}
.hud span{background:var(--panel);border-radius:999px;padding:5px 12px;font-weight:800}
#route{display:flex;gap:6px;margin:6px 0 14px}
.stop{flex:1;display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:12px;padding:6px 8px;color:var(--mute);font-size:.78rem;min-width:0}
.stop i{font-style:normal;width:22px;height:22px;flex:none;border-radius:50%;background:#3a4aa8;display:grid;place-items:center;font-weight:800;color:#fff}
.stop span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop.now{background:var(--sun);color:var(--ink)}.stop.now i{background:var(--ink)}
.stop.done i{background:var(--ok)}
@media (max-width:560px){.stop span{display:none}.stop.now span{display:inline}.stop{flex:0 0 auto}.stop.now{flex:1}}
h2{font-size:1.6rem;line-height:1.1}
.hint{color:var(--mute);margin:6px 0 14px;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:16px}
@media (min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.grid.g2{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--paper);color:var(--ink);border-radius:16px;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.card.wide{max-width:560px;margin:0 auto 14px}
.pic{aspect-ratio:4/3;border-radius:16px 16px 0 0;overflow:hidden;background:#dfe6ff}
.pic.short{aspect-ratio:16/8}
.pic svg{width:100%;height:100%;display:block}
.stub{position:relative;border-top:2px dashed #c9c2a8;padding:12px 10px 10px}
.stub::before,.stub::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.stub::before{left:-9px}.stub::after{right:-9px}
.zone{border:2.5px dashed #9aa6e6;border-radius:12px;min-height:44px;display:flex;align-items:center;justify-content:center;color:#6b76b8;font-weight:800;padding:4px 8px;text-align:center;font-size:.9rem;transition:transform .12s,background .12s}
.zone.hot{background:#fff3c4;border-color:var(--sun);transform:scale(1.04)}
.zone.ok{border-style:solid;border-color:var(--ok);background:#dff8ea;color:#0a6b3c}
.zone + .zone{margin-top:8px}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slots .zone{margin:0;min-width:60px;flex:0 0 auto}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:var(--panel);border-radius:18px;padding:14px 12px;position:sticky;bottom:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);min-height:64px}
.bank.flat{position:static}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;background:var(--sun);color:var(--ink);font-weight:800;padding:10px 16px;border-radius:999px;box-shadow:0 3px 0 #c99a14;display:inline-block;font-size:1rem}
.chip.who{background:var(--aqua);box-shadow:0 3px 0 #178a7e}
.chip.when{background:var(--coral);color:#fff;box-shadow:0 3px 0 #b83048}
.chip.used{opacity:.22;pointer-events:none;box-shadow:none}
.chip.lifted{opacity:.35}
.ghost{position:fixed;z-index:99;pointer-events:none;transform:rotate(-3deg) scale(1.08);box-shadow:0 12px 24px rgba(0,0,0,.4)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.tip{max-width:560px;margin:0 auto 14px;background:var(--panel);border-radius:12px;padding:8px 12px;color:var(--mute);text-align:center}
.tip b{color:var(--sun)}
.btn{font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;font-size:1.15rem;background:var(--sun);color:var(--ink);border:0;border-radius:999px;padding:10px 26px;cursor:pointer;box-shadow:0 4px 0 #c99a14}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #c99a14}
.btn:disabled{opacity:.4;cursor:default}
.btn.small{font-size:.95rem;padding:6px 16px;background:var(--panel);color:#fff;box-shadow:none}
.btn:focus-visible,.chip:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}
.panel{background:var(--panel);border-radius:20px;padding:26px 18px;max-width:520px;margin:24px auto}
.center{text-align:center}
.big{font-size:3.4rem}
.notes{display:none;background:var(--panel);border-radius:12px;padding:10px 14px;margin-bottom:14px;line-height:1.6}
.notes.show{display:block}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.bucket{border-radius:18px;padding:14px 8px;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;border:3px dashed rgba(255,255,255,.55);font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;font-size:1.15rem;transition:transform .12s,background .12s}
.bucket small{font-family:Nunito,sans-serif;font-weight:600;font-size:.8rem;opacity:.9}
.bucket.now{background:#157f77}.bucket.future{background:#b6334a}
.bucket.hot{transform:scale(1.04);border-color:var(--sun);filter:brightness(1.2)}
.bucket .em{font-size:2rem}
.deck{display:flex;justify-content:center;padding:6px 0 4px;min-height:80px}
.deck .chip{font-size:1.1rem;padding:16px 20px;border-radius:18px;max-width:100%;text-align:center;line-height:1.3}
.timebar{height:10px;background:var(--panel);border-radius:99px;overflow:hidden;margin:6px 0 10px}
.timebar i{display:block;height:100%;width:100%;background:var(--aqua);transition:width .1s linear}
.timebar.low i{background:var(--coral)}
.qmark{height:100%;display:grid;place-items:center;font-family:"Baloo 2",sans-serif;font-size:3rem;color:#9aa6e6}
.sentence{min-height:44px;text-align:center;font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;font-size:1.2rem;padding:8px 10px 0;color:var(--ink)}
.plans{max-width:560px;margin:14px auto;padding-left:22px;line-height:1.7}
.cert{background:var(--paper);color:var(--ink);border-radius:20px;padding:26px 18px;max-width:560px;margin:20px auto;text-align:center;border:6px double var(--sun);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.cert h2{font-size:2rem}
.stars{font-size:2.6rem;letter-spacing:6px;color:var(--sun);text-shadow:0 2px 0 #c99a14}
.credit{margin-top:14px;font-size:.9rem;opacity:.85}
.start-ticket{max-width:520px;margin:20px auto}
.start-ticket .row{display:grid;grid-template-columns:repeat(3,1fr)}
.start-ticket .row .pic{border-radius:0;aspect-ratio:1}
.start-ticket .row .pic:first-child{border-top-left-radius:16px}.start-ticket .row .pic:last-child{border-top-right-radius:16px}
.start-ticket h1{font-size:2.1rem;line-height:1.05;padding:14px 12px 4px;text-align:center}
.start-ticket p{margin:0;padding:0 14px 8px;text-align:center;color:#46508f;line-height:1.4}
.start-ticket input{width:100%;font:inherit;font-weight:800;border:2.5px solid #9aa6e6;border-radius:12px;padding:10px 12px;margin:8px 0 12px;color:var(--ink);background:#fff}
footer{text-align:center;color:var(--mute);font-size:.8rem;margin-top:22px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-80px);background:#fff;color:var(--ink);font-weight:800;padding:8px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .25s;z-index:150;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
.conf{position:fixed;top:-30px;font-size:24px;animation:fall 2.4s linear forwards;pointer-events:none;z-index:120}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.clue{padding:14px 12px;font-weight:800;color:var(--ink);text-align:center;line-height:1.3;min-height:84px;display:flex;align-items:center;justify-content:center;font-size:.95rem}
.grid.one{grid-template-columns:1fr!important;max-width:320px;margin-left:auto;margin-right:auto}
.dlg{padding:14px 14px 8px;color:var(--ink);line-height:1.5;font-weight:700}
.gap{padding:12px 14px;color:var(--ink);font-weight:800;line-height:2.1}
.gap .zone{display:inline-flex;min-width:120px;min-height:36px;margin:0 4px;padding:2px 8px;vertical-align:middle}
.chip.long{border-radius:14px;text-align:center;line-height:1.3}
@media (max-width:699px){.grid.stack{grid-template-columns:1fr}}
@media (min-width:700px){.grid.stack{grid-template-columns:repeat(2,1fr)}}
.card .zone{margin:0}
.card.wide .zone+.zone{margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand">Saturday Plans Quest</div>
    <div class="hud"><span>⭐ <b id="score">0</b></span><span>🔥 <b id="streak">0</b></span></div>
  </div>
  <div id="route"></div>
  <main id="stage"></main>
  <footer>Grade 7 · Unit 1 · Lesson 5, part 2 · Created by T.Badria Alfalahi</footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- Drawings (original SVG art) ---------- */
const ART={
bowling:`<rect width="120" height="90" fill="#FFE3B8"/><polygon points="44,6 76,6 112,90 8,90" fill="#D8A25E"/><g fill="#fff" stroke="#c33" stroke-width="1"><ellipse cx="60" cy="16" rx="3.2" ry="5"/><ellipse cx="53" cy="22" rx="3.6" ry="5.5"/><ellipse cx="67" cy="22" rx="3.6" ry="5.5"/><ellipse cx="46" cy="30" rx="4" ry="6"/><ellipse cx="60" cy="30" rx="4" ry="6"/><ellipse cx="74" cy="30" rx="4" ry="6"/></g><circle cx="60" cy="72" r="11" fill="#2457c5"/><circle cx="56" cy="68" r="1.8" fill="#0a1f55"/><circle cx="61" cy="66" r="1.8" fill="#0a1f55"/><circle cx="62" cy="71" r="1.8" fill="#0a1f55"/>`,

science:`<rect width="120" height="90" fill="#D6F0E6"/><path d="M50 12h20v6h-3v22l22 38q3 8-6 8H37q-9 0-6-8l22-38V18h-3z" fill="#fff" stroke="#2d6a5a" stroke-width="3" stroke-linejoin="round"/><path d="M42 62h36l10 18q2 4-4 4H36q-6 0-4-4z" fill="#3ddc84"/><circle cx="58" cy="52" r="3" fill="#b8ffd9"/><circle cx="66" cy="44" r="2" fill="#b8ffd9"/><g fill="none" stroke="#ff8a3d" stroke-width="2"><ellipse cx="102" cy="22" rx="12" ry="5"/><ellipse cx="102" cy="22" rx="12" ry="5" transform="rotate(60 102 22)"/><ellipse cx="102" cy="22" rx="12" ry="5" transform="rotate(120 102 22)"/></g><circle cx="102" cy="22" r="2.5" fill="#ff8a3d"/>`,
cinema:`<rect width="120" height="90" fill="#2b1a4d"/><rect x="14" y="8" width="92" height="44" rx="3" fill="#6ee7ff" stroke="#fff" stroke-width="2"/><text x="60" y="40" text-anchor="middle" font-size="26" font-weight="800" fill="#2b1a4d" font-family="Arial,sans-serif">3D</text><rect x="30" y="62" width="26" height="16" rx="6" fill="#ff3b5c"/><rect x="64" y="62" width="26" height="16" rx="6" fill="#2fb8ff"/><path d="M56 68h8M30 66l-8-4M90 66l8-4" stroke="#fff" stroke-width="3" stroke-linecap="round"/><rect y="84" width="120" height="6" fill="#7a1530"/>`,
gallery:`<rect width="120" height="90" fill="#EADFF5"/><rect x="18" y="10" width="84" height="56" fill="#d4a017"/><rect x="24" y="16" width="72" height="44" fill="#9fdcff"/><circle cx="78" cy="30" r="7" fill="#ffd23f"/><polygon points="24,60 50,32 70,60" fill="#4caf7a"/><polygon points="52,60 76,38 96,60" fill="#2e8b5e"/><rect y="76" width="120" height="14" fill="#b49bd0"/><rect x="44" y="68" width="32" height="8" rx="3" fill="#7b5ea7"/>`,
rink:`<rect width="120" height="90" fill="#DDF3FF"/><ellipse cx="60" cy="78" rx="54" ry="11" fill="#fff" stroke="#9ed8f5" stroke-width="2"/><path d="M38 12h20v28l24 8q8 3 8 11v6H34V22q0-6 4-10z" fill="#e8365d"/><path d="M42 24h12M42 31h12M44 38h12" stroke="#fff" stroke-width="2" stroke-linecap="round"/><rect x="34" y="62" width="56" height="5" fill="#fff"/><rect x="42" y="67" width="4" height="6" fill="#8895b3"/><rect x="78" y="67" width="4" height="6" fill="#8895b3"/><rect x="30" y="72" width="66" height="4" rx="2" fill="#8895b3"/><path d="M100 16l2 5 5 1-4 3 1 5-4-3-4 3 1-5-4-3 5-1z" fill="#9ed8f5"/>`,
safari:`<rect width="120" height="90" fill="#FFD27A"/><circle cx="98" cy="20" r="11" fill="#ff8a3d"/><rect y="68" width="120" height="22" fill="#C98B3F"/><rect x="14" y="34" width="5" height="36" fill="#6b4423"/><ellipse cx="16" cy="32" rx="22" ry="7" fill="#3b8f3a"/><circle cx="72" cy="56" r="20" fill="#b5651d"/><circle cx="72" cy="56" r="13" fill="#f2b457"/><circle cx="62" cy="43" r="5" fill="#f2b457"/><circle cx="82" cy="43" r="5" fill="#f2b457"/><circle cx="67" cy="53" r="2" fill="#222"/><circle cx="77" cy="53" r="2" fill="#222"/><polygon points="72,58 68,63 76,63" fill="#6b3a1a"/><path d="M72 63q-4 5-8 2M72 63q4 5 8 2" stroke="#6b3a1a" stroke-width="1.5" fill="none"/>`,
themepark:`<rect width="120" height="90" fill="#9ADBFF"/><path d="M40 44L24 88M40 44L56 88" stroke="#2457c5" stroke-width="3" fill="none"/><g stroke="#2457c5" stroke-width="3" fill="none"><circle cx="40" cy="44" r="26"/><path d="M40 18V70M14 44H66M22 26L58 62M58 26L22 62"/></g><circle cx="40" cy="44" r="4" fill="#2457c5"/><g fill="#ff5d73"><circle cx="40" cy="18" r="4"/><circle cx="40" cy="70" r="4"/><circle cx="14" cy="44" r="4"/><circle cx="66" cy="44" r="4"/><circle cx="22" cy="26" r="4"/><circle cx="58" cy="26" r="4"/><circle cx="22" cy="62" r="4"/><circle cx="58" cy="62" r="4"/></g><path d="M68 82q10-52 22-52t16 52" stroke="#ff5d73" stroke-width="4" fill="none"/><rect y="84" width="120" height="6" fill="#5cb85c"/>`,
circus:`<rect width="120" height="90" fill="#FFE9A8"/><rect y="78" width="120" height="12" fill="#e0b565"/><rect x="20" y="46" width="16" height="32" fill="#e8365d"/><rect x="36" y="46" width="16" height="32" fill="#fff"/><rect x="52" y="46" width="16" height="32" fill="#e8365d"/><rect x="68" y="46" width="16" height="32" fill="#fff"/><rect x="84" y="46" width="16" height="32" fill="#e8365d"/><polygon points="60,12 14,48 106,48" fill="#2457c5"/><polygon points="60,12 44,48 76,48" fill="#ffc93c"/><path d="M60 12V2" stroke="#6b4423" stroke-width="2"/><polygon points="60,2 74,6 60,10" fill="#e8365d"/><path d="M52 78V62q8-10 16 0v16z" fill="#4a1d5e"/>`,
planetarium:`<rect width="120" height="90" fill="#0d1240"/><path d="M10 80a50 50 0 0 1 100 0z" fill="#2c3a8f"/><rect x="6" y="80" width="108" height="8" fill="#1a2266"/><g fill="#fff"><circle cx="30" cy="62" r="1.5"/><circle cx="44" cy="46" r="1.3"/><circle cx="78" cy="42" r="1.5"/><circle cx="92" cy="60" r="1.3"/><circle cx="70" cy="68" r="1.2"/><circle cx="22" cy="74" r="1.2"/></g><circle cx="58" cy="58" r="10" fill="#ffb347"/><ellipse cx="58" cy="58" rx="19" ry="5" fill="none" stroke="#ffe08a" stroke-width="2.5" transform="rotate(-18 58 58)"/><path d="M96 24a9 9 0 1 0 6 14a7 7 0 1 1-6-14z" fill="#ffe08a"/>`,
playground:`<rect width="120" height="90" fill="#BDEBFF"/><rect y="74" width="120" height="16" fill="#5cb85c"/><rect x="14" y="26" width="10" height="52" fill="#7a4a21"/><rect x="92" y="26" width="10" height="52" fill="#7a4a21"/><circle cx="19" cy="20" r="18" fill="#2e9e4f"/><circle cx="97" cy="20" r="18" fill="#2e9e4f"/><path d="M24 36Q60 56 92 36" stroke="#8b5a2b" stroke-width="1.6" fill="none"/><path d="M24 46Q60 66 92 46" stroke="#8b5a2b" stroke-width="3" fill="none"/><g stroke="#c98a45" stroke-width="3"><path d="M31 50v6M41 53v6M51 55v6M58 56v6M65 55v6M75 53v6M85 50v6"/></g>`
};
const art=id=>`<svg viewBox="0 0 120 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${id}">${ART[id]}</svg>`;
const PLACES=[
 {id:'bowling',name:'bowling alley'},{id:'aquarium',name:'aquarium'},{id:'softplay',name:'soft play centre'},
 {id:'science',name:'science museum'},{id:'cinema',name:'3D cinema'},{id:'gallery',name:'art gallery'},
 {id:'rink',name:'ice rink'},{id:'safari',name:'safari park'},{id:'themepark',name:'theme park'},
 {id:'circus',name:'circus'},{id:'planetarium',name:'planetarium'},{id:'playground',name:'adventure playground'}
];
const P=Object.fromEntries(PLACES.map(p=>[p.id,p]));

/* ---------- Sound & speech ---------- */
let ac;
function beep(f,d,type='sine',v=.14,delay=0){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);const t=ac.currentTime+delay;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={ok(){beep(660,.12);beep(880,.18,'sine',.14,.1)},no(){beep(170,.25,'sawtooth',.07)},win(){[523,659,784,1047].forEach((f,i)=>beep(f,.22,'triangle',.14,i*.12))}};
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}

/* ---------- State & helpers ---------- */
const stage=$('#stage');
let state={name:'',score:0,right:0,wrong:0,streak:0,level:0};
let timer=null;
const clearTimer=()=>{if(timer){clearInterval(timer);timer=null}};
function hud(){$('#score').textContent=state.score;$('#streak').textContent=state.streak}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1500)}
function good(pts=10){state.streak++;const b=state.streak>=3?5:0;state.score+=pts+b;state.right++;sfx.ok();hud();if(b)toast('🔥 Streak bonus +5')}
function bad(el){state.streak=0;state.wrong++;sfx.no();hud();if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}}
function confetti(){const e=['🎉','⭐','🎈','✨','🎊'];for(let i=0;i<36;i++){const d=document.createElement('div');d.className='conf';d.textContent=e[i%e.length];d.style.left=Math.random()*100+'vw';d.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}}

/* ---------- Drag engine (mouse + touch) ---------- */
function makeDraggable(el,onDrop){
  el.addEventListener('pointerdown',e=>{
    if(el.classList.contains('used'))return;
    e.preventDefault();
    const r=el.getBoundingClientRect();
    const g=el.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';
    document.body.appendChild(g);
    const ox=e.clientX-r.left,oy=e.clientY-r.top;
    const move=(x,y)=>{g.style.left=(x-ox)+'px';g.style.top=(y-oy)+'px'};
    move(e.clientX,e.clientY);el.classList.add('lifted');
    let hover=null;
    const under=(x,y)=>{g.style.display='none';const t=document.elementFromPoint(x,y);g.style.display='';return t&&t.closest('.zone,.bucket')};
    const mv=ev=>{move(ev.clientX,ev.clientY);const z=under(ev.clientX,ev.clientY);if(hover!==z){hover&&hover.classList.remove('hot');hover=z;z&&z.classList.add('hot')}};
    const up=ev=>{
      document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
      const z=under(ev.clientX,ev.clientY);g.remove();el.classList.remove('lifted');hover&&hover.classList.remove('hot');
      if(z)onDrop(el,z);
    };
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
  });
}

/* ---------- Route & flow ---------- */
const LEVELS=[{name:'Clue match'},{name:'Listen and choose'},{name:'Fill the gaps'},{name:'Saturday notes'},{name:'My Saturday'}];
function route(){$('#route').innerHTML=LEVELS.map((l,i)=>`<div class="stop ${i<state.level?'done':i===state.level?'now':''}"><i>${i<state.level?'✓':i+1}</i><span>${l.name}</span></div>`).join('')}
function startLevel(){clearTimer();route();window.scrollTo(0,0);[L1,L2,L3,L4,L5][state.level]()}
function levelDone(){
  clearTimer();sfx.win();confetti();state.score+=20;hud();
  const last=state.level===LEVELS.length-1;
  stage.innerHTML=`<div class="panel center"><div class="big">🎟️</div><h2>Mission ${state.level+1} complete!</h2><p class="hint">+20 bonus points</p><button class="btn" id="next">${last?'See my certificate':'Next mission'}</button></div>`;
  $('#next').onclick=()=>{state.level++;last?end():startLevel()};
}
function start(){
  clearTimer();state={name:state.name,score:0,right:0,wrong:0,streak:0,level:0};hud();$('#route').innerHTML='';
  stage.innerHTML=`<div class="card start-ticket"><div class="row"><div class="pic">${art('science')}</div><div class="pic">${art('bowling')}</div><div class="pic">${art('safari')}</div></div>
  <div class="stub"><h1>Saturday Plans Quest</h1><p>Solve the clues, listen to the stories and use the Present continuous for your plans next Saturday!</p>
  <input id="nm" maxlength="24" placeholder="Write your name" aria-label="Your name" value="${esc(state.name)}"><div class="center"><button class="btn" id="go">Start the quest</button></div>
  <p class="credit">Created by T.Badria Alfalahi</p></div></div>`;
  $('#go').onclick=()=>{state.name=$('#nm').value.trim()||'Super Student';startLevel()};
}

/* ---------- Mission 1: Clue match (crossword clues) ---------- */
const CLUES=[
 {id:'planetarium',c:'You can learn about the planets here.'},
 {id:'themepark',c:'You can go on a roller coaster here.'},
 {id:'cinema',c:'You can watch an exciting film here.'},
 {id:'circus',c:'You can see funny clowns here.'},
 {id:'rink',c:'You can have fun ice skating here.'},
 {id:'gallery',c:'You can look at paintings here.'},
 {id:'aquarium',c:'You can see fish here.'}
];
const MYST={id:'science',c:'Mystery place! You can see experiments and learn about science here.'};
function L1(){
  const cl=shuffle(CLUES);
  const rounds=[{items:cl.slice(0,4)},{items:cl.slice(4)},{items:[MYST],extra:['softplay','bowling']}];let r=0;
  function round(){
    const R=rounds[r];let left=R.items.length;
    stage.innerHTML=`<h2>Clue match</h2><p class="hint">${r<2?`Round ${r+1} of 3. Read each clue and drag the right place onto it.`:'Mystery round! Which place is it?'}</p>
    <div class="grid ${R.items.length===1?'one':''}">${R.items.map(c=>`<div class="card"><div class="clue">${esc(c.c)}</div><div class="stub"><div class="zone" data-id="${c.id}">drop here</div></div></div>`).join('')}</div>
    <div class="bank">${shuffle([...R.items.map(c=>c.id),...(R.extra||[])]).map(id=>`<div class="chip" data-id="${id}">${P[id].name}</div>`).join('')}</div>`;
    stage.querySelectorAll('.chip').forEach(c=>makeDraggable(c,(chip,z)=>{
      if(!z.dataset.id||z.classList.contains('ok'))return;
      if(z.dataset.id===chip.dataset.id){
        z.textContent=chip.textContent;z.classList.add('ok');chip.classList.add('used');
        const card=z.closest('.card'),pic=document.createElement('div');pic.className='pic';pic.innerHTML=art(z.dataset.id);card.insertBefore(pic,card.firstChild);
        say(chip.textContent);good(r===2?20:10);if(r===2)toast('Mystery solved: science museum!');
        if(--left===0)setTimeout(()=>{r++;r<3?round():levelDone()},1300);
      }else bad(z);
    }));
  }
  round();
}

/* ---------- Mission 2: Listen and choose (dialogue 1.12 ideas) ---------- */
const DLG=[
 {a:'science',t:'Two boys talk about next Saturday. One boy has free tickets. The place is next to the ice rink.'},
 {a:'bowling',t:'Two girls want to go ice skating, but the ice rink is always busy. They choose something else and do not need to phone first.'},
 {a:'playground',t:'A mother wants to take two young girls somewhere fun in the holidays. The soft play centre is too young for them.'},
 {a:'safari',t:'Two girls talk about the circus. The circus animals are not very happy, so they choose a place where animals can run free.'}
];
function L2(){
  let left=DLG.length;
  const ids=[...DLG.map(d=>d.a),'rink','circus','softplay'];
  stage.innerHTML=`<h2>Listen and choose</h2><p class="hint">Tap 🔊 to hear each short story, or read it. Then drag the correct place onto each card.</p>
  <div class="grid g2 stack">${shuffle(DLG).map(d=>`<div class="card"><div class="dlg">${esc(d.t)}</div><div class="center" style="padding:0 10px 10px"><button class="btn small say" data-t="${esc(d.t)}">🔊 Listen</button></div><div class="stub"><div class="zone" data-id="${d.a}">drop the place</div></div></div>`).join('')}</div>
  <div class="bank">${shuffle(ids).map(id=>`<div class="chip" data-id="${id}">${P[id].name}</div>`).join('')}</div>`;
  stage.querySelectorAll('.say').forEach(b=>b.onclick=()=>say(b.dataset.t));
  stage.querySelectorAll('.chip').forEach(c=>makeDraggable(c,(chip,z)=>{
    if(!z.dataset.id||z.classList.contains('ok'))return;
    if(z.dataset.id===chip.dataset.id){
      z.textContent=chip.textContent;z.classList.add('ok');chip.classList.add('used');good();
      const card=z.closest('.card'),pic=document.createElement('div');pic.className='pic short';pic.innerHTML=art(z.dataset.id);card.insertBefore(pic,card.firstChild);
      if(--left===0)setTimeout(levelDone,1200);
    }else bad(z);
  }));
}

/* ---------- Mission 3: Fill the gaps ---------- */
const GAPS=[
 {b:['My friends and I','to the safari park tomorrow.'],h:'not go',a:"aren't going"},
 {b:['I','with my grandparents next summer.'],h:'stay',a:'am staying'},
 {b:['Muhanad','bowling with his friends this evening.'],h:'not go',a:"isn't going"},
 {b:['You and your friends','a film this Saturday.'],h:'watch',a:'are watching'},
 {b:['Tasneem','Bahrain with her family next month.'],h:'visit',a:'is visiting'},
 {b:['My parents','tomorrow.'],h:'not work',a:"aren't working"}
];
function L3(){
  let left=GAPS.length;
  stage.innerHTML=`<h2>Fill the gaps</h2><p class="hint">We use the Present continuous for future plans. Drag the correct verb form into each gap.</p>
  <div class="grid stack">${GAPS.map(g=>`<div class="card"><div class="gap">${esc(g.b[0])} <span class="zone" data-a="${esc(g.a)}">(${g.h})</span> ${esc(g.b[1])}</div></div>`).join('')}</div>
  <div class="bank">${shuffle([...GAPS.map(g=>g.a),"isn't watching",'are visiting']).map(w=>`<div class="chip">${esc(w)}</div>`).join('')}</div>`;
  stage.querySelectorAll('.chip').forEach(c=>makeDraggable(c,(chip,z)=>{
    if(!z.dataset.a||z.classList.contains('ok'))return;
    if(z.dataset.a===chip.textContent){z.textContent=chip.textContent;z.classList.add('ok');chip.classList.add('used');say(z.closest('.gap').textContent.replace(/\s+/g,' '));good();if(--left===0)setTimeout(levelDone,1200)}
    else bad(z);
  }));
}

/* ---------- Mission 4: Saturday notes ---------- */
const NOTES=[
 {w:'Halima',n:'help dad – home',ok:true,s:'Halima is helping her dad at home.'},
 {w:'Halima',n:'have pizza – lunch',ok:false,s:"Halima isn't having pizza for lunch."},
 {w:'Halima',n:'visit grandad',ok:true,s:'Halima is visiting her grandad.'},
 {w:'Anas and Zaid',n:'go to planetarium',ok:true,s:'Anas and Zaid are going to the planetarium.'},
 {w:'Anas and Zaid',n:'eat lunch – café',ok:true,s:'Anas and Zaid are eating lunch at a café.'},
 {w:'Anas and Zaid',n:'watch film',ok:false,s:"Anas and Zaid aren't watching a film."}
];
function L4(){
  const rounds=[[0,1,2],[3,4,5]];let r=0;
  function round(){
    const idx=rounds[r];let left=idx.length;
    stage.innerHTML=`<h2>Saturday notes</h2><p class="hint">Round ${r+1} of 2. ✅ means a plan for next Saturday. ❌ means not a plan. Drag the matching sentence onto each note.</p>
    <div class="grid stack">${idx.map(i=>`<div class="card"><div class="clue">${esc(NOTES[i].w)}: ${esc(NOTES[i].n)} ${NOTES[i].ok?'✅':'❌'}</div><div class="stub"><div class="zone" data-i="${i}">drop the sentence</div></div></div>`).join('')}</div>
    <div class="bank">${shuffle(idx).map(i=>`<div class="chip long" data-i="${i}">${esc(NOTES[i].s)}</div>`).join('')}</div>`;
    stage.querySelectorAll('.chip').forEach(c=>makeDraggable(c,(chip,z)=>{
      if(!z.dataset.i||z.classList.contains('ok'))return;
      if(z.dataset.i===chip.dataset.i){z.textContent=chip.textContent;z.classList.add('ok');chip.classList.add('used');say(chip.textContent);good();if(--left===0)setTimeout(()=>{r++;r<2?round():levelDone()},1200)}
      else{bad(z);toast('Check the name and the ✅ / ❌')}
    }));
  }
  round();
}

/* ---------- Mission 5: My Saturday ---------- */
const ACTS=[['go shopping',"I'm going shopping."],['have a family party',"I'm having a family party."],['help my parents',"I'm helping my parents."],['play hockey',"I'm playing hockey."],['see friends',"I'm seeing friends."],['visit a castle',"I'm visiting a castle."],['watch cartoons',"I'm watching cartoons."],['do the gardening',"I'm doing the gardening."],['tidy my room',"I'm tidying my room."]];
const SLOTS=['Saturday morning','Saturday lunchtime','Saturday afternoon','Saturday evening','Saturday night'];
function L5(){
  let left=SLOTS.length;
  stage.innerHTML=`<h2>My Saturday</h2><p class="hint">Plan your day! Drag five activities into your planner. Each one turns into a Present continuous sentence.</p>
  <div class="card wide"><div style="padding:12px">${SLOTS.map(s=>`<div class="zone" data-slot="${s}">${s}</div>`).join('')}</div></div>
  <div class="center" style="margin-bottom:14px"><button class="btn" id="fin" disabled>Finish my Saturday</button></div>
  <div class="bank flat">${ACTS.map(a=>`<div class="chip" data-s="${esc(a[1])}">${a[0]}</div>`).join('')}</div>`;
  stage.querySelectorAll('.chip').forEach(c=>makeDraggable(c,(chip,z)=>{
    if(!z.dataset.slot||z.classList.contains('ok'))return;
    z.textContent=z.dataset.slot+': '+chip.dataset.s;z.classList.add('ok');chip.classList.add('used');say(chip.dataset.s);good();
    if(--left===0)$('#fin').disabled=false;
  }));
  $('#fin').onclick=levelDone;
}

/* ---------- Certificate ---------- */
function end(){
  clearTimer();$('#route').innerHTML='';sfx.win();confetti();
  const tot=state.right+state.wrong,acc=tot?state.right/tot:1,stars=acc>.85?3:acc>.65?2:1;
  stage.innerHTML=`<div class="cert"><div class="big">🏆</div><h2 id="cn"></h2><p>You solved the clues and planned your Saturday with the Present continuous!</p>
  <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p><b>${state.score}</b> points · <b>${state.right}</b> correct answers</p>
  <p class="credit">Created by T.Badria Alfalahi</p></div><div class="center"><button class="btn" id="again">Play again</button></div>`;
  $('#cn').textContent='Well done, '+state.name+'!';
  $('#again').onclick=start;
}

hud();start();
</script>
